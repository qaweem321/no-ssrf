name: Release

# Publishes to npm when a version tag (v1.2.3) is pushed. No npm token or passkey: npm trusts
# this workflow through trusted publishing (OIDC), set up once in the package's npm settings
# (publisher: GitHub Actions, repository qaweem321/no-ssrf, workflow release.yml).
#
#   npm version 1.2.3 && git push --follow-tags

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # lets npm verify this run and publish with provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: The tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json ($version)"
            exit 1
          fi
      - run: npm ci
      # prepublishOnly runs the full check (types, tests, build, playground) first.
      - run: npm publish --access public
